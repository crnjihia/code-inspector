name: Publish Extension to Marketplace

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Extension
        run: npm run build --workspace=extension

      - name: Package VSIX
        run: |
          cd extension
          npx @vscode/vsce package --no-git-tag-version -o code-inspector-${{ github.ref_name }}.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not configured. Skipping VS Code Marketplace publishing."
            exit 0
          fi
          cd extension
          npx @vscode/vsce publish -p "$VSCE_PAT"

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: extension/code-inspector-${{ github.ref_name }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
