version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CODE_INSPECTOR_API_KEY=${CODE_INSPECTOR_API_KEY:-${KAGUA_API_KEY}}
    depends_on:
      - redis
volumes:
  redis-data:
    driver: local
