<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Accent -->
  <path d="M8 32h48M32 8v48" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Code Bracket Left -->
  <path d="M18 22l-6 10 6 10" stroke="url(#cyan-glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-blur)" />
  
  <!-- Code Bracket Right -->
  <path d="M46 22l6 10-6 10" stroke="url(#violet-glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-blur)" />

  <!-- Center Magnifier Ring (Inspector Lens) -->
  <circle cx="30" cy="30" r="10" stroke="#00f0ff" stroke-width="2.5" fill="#00f0ff" fill-opacity="0.1" filter="url(#glow-blur)"/>
  
  <!-- Magnifier Handle -->
  <path d="M37.5 37.5L47 47" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow-blur)" />

  <!-- Sparkle / Ray inside lens -->
  <circle cx="28" cy="28" r="2.5" fill="#ffffff" />
  <path d="M26 34l8-8" stroke="#00f0ff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
</svg>
